services:

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - diana-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
    restart: unless-stopped
    networks:
      - diana-network

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-diana_tours}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - diana-network

volumes:
  pgdata:
    driver: local

networks:
  diana-network:
    driver: bridge
